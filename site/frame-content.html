<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Frame Content</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f0f4ff; color: #2d3436; font-size: 14px; }
    .tag { display: inline-block; padding: 2px 10px; background: rgba(67,97,238,0.12); color: #4361ee; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
    h2 { font-size: 16px; color: #4361ee; margin-bottom: 6px; }
    p { font-size: 13px; color: #636e72; margin-bottom: 14px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.3px; }
    input, select { width: 100%; padding: 8px 10px; border: 1px solid #dee2e6; border-radius: 6px; font-size: 14px; outline: none; font-family: inherit; }
    input:focus, select:focus { border-color: #4361ee; box-shadow: 0 0 0 3px rgba(67,97,238,0.1); }
    .btn { display: inline-flex; align-items: center; padding: 8px 16px; background: #4361ee; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; font-family: inherit; transition: background 0.15s; }
    .btn:hover { background: #3f37c9; }
    .result { margin-top: 10px; padding: 8px 12px; background: #1e1e2e; color: #a8e6cf; border-radius: 6px; font-size: 12px; font-family: monospace; display: none; }
    .counter { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .counter-display { font-size: 28px; font-weight: 700; color: #4361ee; min-width: 40px; text-align: center; }
    .count-btn { width: 32px; height: 32px; border: none; border-radius: 6px; cursor: pointer; font-size: 18px; font-weight: 600; font-family: inherit; }
    .count-minus { background: #ef233c; color: white; }
    .count-plus { background: #06d6a0; color: white; }
    hr { margin: 16px 0; border: none; border-top: 1px solid #dee2e6; }
  </style>
</head>
<body>
  <span class="tag">iFrame Content</span>
  <h2>You are inside an iFrame!</h2>
  <p>Use <code>page.frameLocator('iframe')</code> to interact with elements here.</p>

  <div class="form-group">
    <label for="frame-input">Text Input (inside frame)</label>
    <input
      type="text"
      id="frame-input"
      data-testid="frame-input"
      placeholder="Type something inside the frame..."
    />
  </div>

  <div class="form-group">
    <label for="frame-select">Dropdown (inside frame)</label>
    <select id="frame-select" data-testid="frame-select">
      <option value="">-- Select an option --</option>
      <option value="playwright">Playwright</option>
      <option value="selenium">Selenium</option>
      <option value="cypress">Cypress</option>
      <option value="puppeteer">Puppeteer</option>
    </select>
  </div>

  <button class="btn" data-testid="frame-submit-btn" id="frame-submit-btn" onclick="handleSubmit()">
    Submit (Inside Frame)
  </button>

  <div class="result" data-testid="frame-result" id="frame-result"></div>

  <hr>

  <label>Counter (inside frame)</label>
  <div class="counter">
    <button class="count-btn count-minus" data-testid="frame-count-minus" onclick="changeCount(-1)">-</button>
    <span class="counter-display" data-testid="frame-counter-value" id="frame-counter">0</span>
    <button class="count-btn count-plus" data-testid="frame-count-plus" onclick="changeCount(1)">+</button>
  </div>

  <script>
    let count = 0;
    function changeCount(delta) {
      count += delta;
      document.getElementById('frame-counter').textContent = count;
    }
    function handleSubmit() {
      const input = document.getElementById('frame-input').value;
      const select = document.getElementById('frame-select').value;
      const result = document.getElementById('frame-result');
      result.textContent = `Input: "${input || '(empty)'}" | Select: "${select || 'none selected'}"`;
      result.style.display = 'block';
    }
  </script>
</body>
</html>
